<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Web Site Login DevTech</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="card-login">
    <h1>DevTech Tecnologias</h1>
    <h2>Faça o seu login</h2>
        <label for ="email">Digite seu Email:</label>
        <input type="email" id="email" name="email" placeholder="e-mail" required>

        <label for ="senha">Digite sua Senha:</label>
        <div class ="campo-senha">
            <input type="password" id="senha" name="senha" placeholder="senha" required>
            <button type="button" onclick="verSenha()" id="btn-olho">👁️</button>
        </div>

        <button type="button" onclick="entrar()">Entrar</button>
        <p style="text-align: center; margin-top: 16px; font-size: 14px; color: #6b7fa3;">
            Ainda não tem conta? <a href="cadastro.html" style="color: #4f8ef7; font-weight: 600; text-decoration: none;">Cadastre-se</a>
        </p>
    </div>

    <script>
        function entrar() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if (email === "" || senha === "") {
                alert("Preencha todos os campos!");
                return;
            }

            const btn = document.querySelector('button[onclick="entrar()"]');
            btn.disabled = true;
            btn.textContent = "Entrando...";

            auth.signInWithEmailAndPassword(email, senha)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
                        alert("Email ou senha incorretos!");
                    } else {
                        alert("Erro ao entrar: " + error.message);
                    }
                    btn.disabled = false;
                    btn.textContent = "Entrar";
                });
        }

        function verSenha() {
    const input = document.getElementById("senha");
    const btn = document.getElementById("btn-olho");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈"; // olho fechado quando mostrando
    } else {
        input.type = "password";
        btn.textContent = "👁️"; // olho aberto quando escondendo
    }
}
    </script>
    
</body>
</html>
